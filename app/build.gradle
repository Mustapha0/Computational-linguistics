plugins {
    id 'com.android.application'
}

android {
    namespace 'org.example.computationallinguistics'
    compileSdk 35

    defaultConfig {
        applicationId 'org.example.computationallinguistics'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    lint {
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
